; ============================================================================
;  INNOV+IOT LED Sign Controller
;  ESP32 + WS2812B  |  driven over USB serial by webapp/index.html
; ============================================================================

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -Wno-unused-variable

lib_deps =
    ; NeoPixelBus drives the ESP32 RMT peripheral in hardware, asynchronously.
    ; FastLED is gone: on Arduino core 2.x (IDF 4.4) it silently fell back to
    ; a software bit-banger, which the FreeRTOS tick interrupted ~1 ms in, so
    ; everything past LED 32 received garbage. The colour maths it used to
    ; provide now lives in include/Color.h.
    makuna/NeoPixelBus @ ^2.7.9
    bblanchon/ArduinoJson @ ^7.0.4
