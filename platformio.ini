; ============================================================================
;  INNOV+IOT LED Sign Controller
;  ESP32 + WS2812B  |  Web UI (black & white) + Serial debug console
; ============================================================================

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; 3 MB app partition - the async web server + FastLED overflow the default 1.3 MB
board_build.partitions = huge_app.csv

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D FASTLED_RMT_MAX_CHANNELS=1
    -Wno-unused-variable

lib_deps =
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.0.4
    esp32async/AsyncTCP @ ^3.2.5
    esp32async/ESPAsyncWebServer @ ^3.6.0
