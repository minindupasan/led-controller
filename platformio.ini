; ============================================================================
;  INNOV IOT - two boards, one codebase
;
;    env:sign   ESP #1  the INNOV IOT letters, GPIO13
;               joins the lamp's AP as 192.168.4.2
;
;    env:lamp   ESP #2  the oil lamp, GPIO27, RFID guest segments
;               hosts the AP, takes taps from the Mac bridge,
;               and triggers the sign when the last guest taps
;
;  Build and flash them separately:
;    pio run -e sign -t upload --upload-port /dev/cu.usbserial-0001
;    pio run -e lamp -t upload --upload-port /dev/cu.usbserial-XXXX
; ============================================================================

[env]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; the async web server needs more than the default 1.3 MB app partition
board_build.partitions = huge_app.csv

; packs webapp/index.html into include/WebPage.h before every build
extra_scripts = pre:scripts/embed_webapp.py

lib_deps =
    ; NeoPixelBus drives the ESP32 RMT peripheral in hardware, asynchronously.
    ; FastLED is deliberately absent: on Arduino core 2.x (IDF 4.4) it falls
    ; back to a software bit-banger that the FreeRTOS tick interrupts ~1 ms
    ; in, so everything past LED 32 receives garbage. The colour maths it used
    ; to provide lives in include/Color.h.
    makuna/NeoPixelBus @ ^2.7.9
    bblanchon/ArduinoJson @ ^7.0.4
    esp32async/AsyncTCP @ ^3.2.5
    esp32async/ESPAsyncWebServer @ ^3.6.0

; ------------------------------------------------------------- ESP #1: sign
[env:sign]
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ROLE_SIGN=1
    -Wno-unused-variable
build_src_filter = +<*> -<main_lamp.cpp> -<Lamp.cpp>

; ------------------------------------------------------------- ESP #2: lamp
[env:lamp]
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ROLE_LAMP=1
    -Wno-unused-variable
build_src_filter = +<*> -<main_sign.cpp> -<Effects.cpp> -<Show.cpp> -<LedController.cpp>
